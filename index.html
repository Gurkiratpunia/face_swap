<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Face Swap — Simple, Robust (MediaPipe)</title>
<style>
  body{margin:0;font-family:Inter,system-ui,Arial;background:#071022;color:#e6eef6}
  .wrap{display:flex;gap:12px;padding:14px;align-items:flex-start}
  .panel{background:#071827;padding:12px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,0.6);width:720px}
  aside{width:300px;background:#061420;padding:12px;border-radius:10px}
  canvas{width:100%;border-radius:8px;background:#000;display:block}
  .row{display:flex;gap:8px;margin-top:8px;align-items:center}
  button{background:#66e4b4;border:none;padding:8px 12px;border-radius:8px;color:#012;cursor:pointer;font-weight:700}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#9aa6b2}
  label{color:#9aa6b2;font-size:13px}
  input[type=range]{width:100%}
  .muted{color:#9aa6b2;font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h2 style="margin:0 0 8px 0">Face Swap — Simple & Robust</h2>
      <canvas id="out" width="720" height="540"></canvas>
      <div class="row">
        <button id="start">Start</button>
        <button id="stop" class="ghost">Stop</button>
        <button id="snap" class="ghost">Snapshot</button>
        <div style="margin-left:auto" class="muted" id="status">Idle</div>
      </div>
      <div class="muted" style="margin-top:8px">This version swaps whole face regions (ellipse mask) with rotation+scale. Works reliably in more environments.</div>
    </div>

    <aside>
      <div style="margin-bottom:10px"><label>Blend</label><input id="blend" type="range" min="0" max="1" step="0.01" value="0.95"></div>
      <div style="margin-bottom:10px"><label>Smoothing</label><input id="smooth" type="range" min="0" max="1" step="0.01" value="0.8"></div>
      <div style="margin-bottom:10px"><label>Resolution</label><select id="res"><option value="720x540">720×540</option><option value="960x720">960×720</option><option value="640x480">640×480</option></select></div>
      <div style="margin-bottom:10px"><label><input type="checkbox" id="mirror"> Mirror (selfie)</label></div>
      <div class="muted" style="margin-top:12px">If it still fails: paste console errors or tell me your browser & OS. I'll debug further.</div>
    </aside>
  </div>

  <!-- MediaPipe FaceMesh + Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/*
  Simpler face-swap:
  - MediaPipe FaceMesh gives landmarks
  - For top-2 faces: compute ellipse region (hull), compute center/scale/rotation from eyes & face width
  - Extract each face into offscreen canvas, mask to ellipse (destination-in)
  - Draw faceA onto faceB transform (rotate/scale) and vice versa with blend alpha
  - Less fragile than triangulation, more robust in real-world conditions
*/

const out = document.getElementById('out');
const ctx = out.getContext('2d');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const snapBtn = document.getElementById('snap');
const statusEl = document.getElementById('status');
const blendRange = document.getElementById('blend');
const smoothRange = document.getElementById('smooth');
const resSelect = document.getElementById('res');
const mirrorCheckbox = document.getElementById('mirror');

let video = document.createElement('video');
video.autoplay = true; video.playsInline = true; video.muted = true;
let camera = null;
let faceMesh = null;
let running = false;
let fpsCount = 0, fpsTimer = performance.now();

// offscreen canvases for extraction/masking
const vidCanvas = document.createElement('canvas'), vidCtx = vidCanvas.getContext('2d');
const faceAcanvas = document.createElement('canvas'), faceActx = faceAcanvas.getContext('2d');
const faceBcanvas = document.createElement('canvas'), faceBctx = faceBcanvas.getContext('2d');

function setSizes(){
  const [w,h] = resSelect.value.split('x').map(Number);
  out.width = w; out.height = h;
  vidCanvas.width = w; vidCanvas.height = h;
  faceAcanvas.width = faceBcanvas.width = w; faceAcanvas.height = faceBcanvas.height = h;
}
setSizes();
resSelect.addEventListener('change', setSizes);

// utility: compute bounding ellipse & orientation from landmarks
function computeFaceParams(landmarks, w, h){
  // landmarks: array of {x,y,z} normalized 0..1
  // convert to canvas coords
  const pts = landmarks.map(p => [p.x * w, p.y * h]);
  // use left eye average and right eye average for rotation
  const leftEyeIdxs = [33, 7, 163, 144, 145, 153, 154, 155, 133]; // approximate
  const rightEyeIdxs = [263, 249, 390, 373, 374, 380, 381, 382, 362];
  const avg = idxs => {
    let sx=0, sy=0;
    idxs.forEach(i => { sx += pts[i][0]; sy += pts[i][1]; });
    return [sx/idxs.length, sy/idxs.length];
  }
  const leftEye = avg(leftEyeIdxs);
  const rightEye = avg(rightEyeIdxs);
  const cx = (leftEye[0] + rightEye[0]) / 2;
  const cy = (leftEye[1] + rightEye[1]) / 2;
  // face width approx between cheek points
  const leftCheek = pts[234] || pts[127] || leftEye;
  const rightCheek = pts[454-1] || pts[356] || rightEye;
  // fallback to nose points for scale if cheeks missing
  const dx = rightEye[0] - leftEye[0];
  const angle = Math.atan2(dx ? 0 : 0, 1) || Math.atan2(rightEye[1]-leftEye[1], rightEye[0]-leftEye[0]);
  // approximate face radius: max distance from center to hull points times factor
  let maxD = 0;
  for(const p of pts){
    const d = Math.hypot(p[0]-cx, p[1]-cy);
    if(d > maxD) maxD = d;
  }
  const radius = maxD * 1.05;
  // return center, radius, angle and raw pts for mask
  return {center:[cx,cy], radius, angle, pts};
}

function ellipseMask(ctx, cx, cy, rx, ry, rotation){
  ctx.save();
  ctx.beginPath();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.closePath();
  ctx.restore();
  ctx.fill();
}

// Helper: create extracted face image on canvas masked to ellipse
function extractFaceToCanvas(srcCanvas, targetCtx, params, mirror=false){
  const w = srcCanvas.width, h = srcCanvas.height;
  targetCtx.clearRect(0,0,w,h);
  // draw full frame into target (we'll mask it)
  targetCtx.save();
  if(mirror){
    targetCtx.translate(w,0); targetCtx.scale(-1,1);
    targetCtx.drawImage(srcCanvas, 0, 0, w, h);
    targetCtx.setTransform(1,0,0,1,0,0);
  } else {
    targetCtx.drawImage(srcCanvas, 0, 0, w, h);
  }
  // mask to ellipse using destination-in
  targetCtx.globalCompositeOperation = 'destination-in';
  targetCtx.fillStyle = 'black';
  targetCtx.fillRect(0,0,w,h);
  targetCtx.fillStyle = 'white';
  targetCtx.save();
  targetCtx.translate(0,0);
  targetCtx.beginPath();
  // ellipse dims from params
  const cx = params.center[0], cy = params.center[1];
  const r = params.radius;
  // choose rx,ry
  const rx = r*0.9, ry = r*1.05;
  targetCtx.translate(cx, cy);
  targetCtx.rotate(params.angle);
  targetCtx.ellipse(0,0, rx, ry, 0, 0, Math.PI*2);
  targetCtx.closePath();
  targetCtx.fill();
  targetCtx.restore();
  targetCtx.globalCompositeOperation = 'source-over';
}

// draw extracted face onto destination center with rotation & scale
function drawExtractedFace(destCtx, faceCanvas, srcParams, dstParams, alpha=1.0){
  const w = faceCanvas.width, h = faceCanvas.height;
  // compute scale ratio: dst radius / src radius
  const scale = (dstParams.radius / srcParams.radius) || 1.0;
  // compute rotation difference: dstAngle - srcAngle
  const rot = dstParams.angle - srcParams.angle;
  destCtx.save();
  destCtx.globalAlpha = alpha;
  // move to destination center
  destCtx.translate(dstParams.center[0], dstParams.center[1]);
  destCtx.rotate(rot);
  destCtx.scale(scale, scale);
  // draw the faceCanvas centered at src center offset
  // we need to translate so that srcParams.center maps to (0,0) after scale/rotate
  const sx = srcParams.center[0], sy = srcParams.center[1];
  destCtx.drawImage(faceCanvas, -sx, -sy);
  destCtx.restore();
  destCtx.globalAlpha = 1.0;
}

// actual processing with MediaPipe results (raw landmarks)
let lastSmoothed = null;
async function onResults(results){
  if(!running) return;
  const w = out.width, h = out.height;

  // draw incoming image to vidCanvas (apply mirror if needed)
  vidCtx.save();
  if(mirrorCheckbox.checked) { vidCtx.translate(w,0); vidCtx.scale(-1,1); }
  if(results.image) vidCtx.drawImage(results.image, 0, 0, w, h);
  vidCtx.restore();

  // compute FPS
  fpsCount++;
  const tNow = performance.now();
  if(tNow - fpsTimer >= 1000){ statusEl.innerText = 'FPS: ' + fpsCount; fpsCount = 0; fpsTimer = tNow; }

  const multi = results.multiFaceLandmarks || [];
  if(multi.length < 2){
    // just show camera feed when <2 faces
    ctx.clearRect(0,0,w,h);
    ctx.drawImage(vidCanvas, 0, 0);
    statusEl.innerText = 'Need two faces — faces found: ' + multi.length;
    return;
  }

  // pick largest two faces by bounding box
  const faces = multi.map((lm, idx)=>{
    let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
    for(const p of lm){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }
    return {lm, idx, area:(maxX-minX)*(maxY-minY)};
  }).sort((a,b)=>b.area - a.area);

  const face1 = faces[0].lm, face2 = faces[1].lm;

  // compute params (smoothed)
  const p1 = computeFaceParams(face1, w, h);
  const p2 = computeFaceParams(face2, w, h);

  // smoothing
  const alpha = parseFloat(smoothRange.value);
  if(!lastSmoothed) lastSmoothed = {p1, p2};
  const smoothParam = (prev, curr) => {
    return {
      center: [ prev.center[0]*(1-alpha) + curr.center[0]*alpha, prev.center[1]*(1-alpha) + curr.center[1]*alpha ],
      radius: prev.radius*(1-alpha) + curr.radius*alpha,
      angle: prev.angle*(1-alpha) + curr.angle*alpha,
      pts: curr.pts
    };
  };
  const sp1 = smoothParam(lastSmoothed.p1, p1);
  const sp2 = smoothParam(lastSmoothed.p2, p2);
  lastSmoothed = {p1:sp1, p2:sp2};

  // extract face images (masked)
  extractFaceToCanvas(vidCanvas, faceActx, sp1, mirrorCheckbox.checked);
  extractFaceToCanvas(vidCanvas, faceBctx, sp2, mirrorCheckbox.checked);

  // composite: start from original frame
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(vidCanvas, 0, 0);

  // draw faceA onto faceB and faceB onto faceA with blending
  const blend = parseFloat(blendRange.value);

  // draw faceA -> p2
  drawExtractedFace(ctx, faceAcanvas, sp1, sp2, blend);
  // draw faceB -> p1
  drawExtractedFace(ctx, faceBcanvas, sp2, sp1, blend);

  statusEl.innerText = 'Swapping — faces found: ' + multi.length;
}

// initialize faceMesh and camera
async function init(){
  faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
  faceMesh.setOptions({
    maxNumFaces: 2,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onResults);

  camera = new Camera(video, {
    onFrame: async () => { await faceMesh.send({image: video}); },
    width: out.width,
    height: out.height
  });
}

startBtn.addEventListener('click', async ()=>{
  if(running) return;
  try{
    setSizes();
    if(!faceMesh) await init();
    await camera.start();
    running = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    statusEl.innerText = 'Started — allow camera';
  }catch(err){
    console.error(err);
    alert('Could not start camera/face model: ' + (err && err.message ? err.message : err));
  }
});

stopBtn.addEventListener('click', ()=>{
  if(!running) return;
  camera.stop();
  running = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  statusEl.innerText = 'Stopped';
});

snapBtn.addEventListener('click', ()=>{
  const url = out.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url; a.download = 'faceswap_snap.png'; a.click();
});

// disable stop initially
stopBtn.disabled = true;

</script>
</body>
</html>
